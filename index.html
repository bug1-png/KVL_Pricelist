<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KAVALON Pricelist</title>
<style>
:root{
  --bg:#05080f;--card:rgba(16,24,40,.72);--ink:#e8f1ff;--mute:#8195b3;--line:rgba(120,170,255,.16);
  --brand:#00e5ff;--brand-ink:#021018;--accent:#8b5cf6;--accent-soft:rgba(139,92,246,.12);
  --ok:#2dffb0;--ok-bg:rgba(45,255,176,.12);--warn:#ffb84d;--warn-bg:rgba(255,184,77,.13);
  --chip:rgba(120,170,255,.08);--glow:0 0 18px rgba(0,229,255,.35);
  --grad:linear-gradient(135deg,#00e5ff,#8b5cf6);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:radial-gradient(900px 500px at 85% -10%,rgba(139,92,246,.22),transparent 60%),radial-gradient(700px 500px at -10% 10%,rgba(0,229,255,.14),transparent 60%),var(--bg);background-attachment:fixed;color:var(--ink);font:16px/1.45 "Segoe UI","Sarabun","Noto Sans Thai",system-ui,sans-serif;padding-bottom:90px}
button,input,select{font:inherit;color:inherit}
select option{background:#0c1424;color:#e8f1ff}
header{position:sticky;top:0;z-index:20;background:rgba(5,8,15,.78);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top))}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.top h1{font-size:19px;margin:0;letter-spacing:.32em;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.top small{color:var(--brand);font-size:12px;letter-spacing:.08em;border:1px solid var(--line);border-radius:999px;padding:2px 10px}
.search{display:flex;gap:8px;margin-top:10px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:12px;padding:11px 14px;background:rgba(120,170,255,.07);color:var(--ink);outline:none;transition:.2s}
.search input:focus{border-color:var(--brand);box-shadow:var(--glow)}
.search input::placeholder{color:var(--mute)}
.btn-filter{border:0;border-radius:12px;padding:0 16px;background:var(--grad);color:#fff;font-weight:700;white-space:nowrap;box-shadow:0 0 16px rgba(139,92,246,.45)}
.btn-filter .n{display:inline-block;min-width:20px;height:20px;line-height:20px;border-radius:10px;background:rgba(0,0,0,.4);color:#fff;font-size:12px;text-align:center;margin-left:6px}
.active{display:flex;flex-wrap:wrap;gap:6px;padding:10px 16px 0;max-width:760px;margin:0 auto}
.tag{display:flex;align-items:center;gap:6px;background:var(--chip);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:13px}
.tag b{font-weight:600;color:var(--brand)}
.tag i{font-style:normal;color:var(--mute)}
.bar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px 4px;color:var(--mute);font-size:14px;max-width:760px;margin:0 auto}
.bar b{color:var(--brand);font-size:20px;text-shadow:0 0 12px rgba(0,229,255,.6)}
.bar select{border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:6px 10px;font-size:14px}
.list{padding:6px 16px;display:grid;gap:12px;max-width:760px;margin:0 auto}
.card{position:relative;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:.2s}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:3px;border-radius:3px;background:var(--grad);box-shadow:var(--glow)}
.card.open{border-color:rgba(0,229,255,.4);box-shadow:0 0 24px rgba(0,229,255,.12)}
.card>button{all:unset;display:block;width:100%;padding:15px 15px 15px 18px;cursor:pointer;box-sizing:border-box}
.r1{display:flex;justify-content:space-between;align-items:center;gap:8px}
.unit{font-size:23px;font-weight:800;letter-spacing:.06em;font-family:Consolas,"SF Mono",Menlo,monospace}
.unit small{font-family:"Segoe UI","Sarabun",sans-serif;letter-spacing:0;font-size:13px;font-weight:500;color:var(--mute);margin-left:8px}
.st{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--ok-bg);color:var(--ok);border:1px solid color-mix(in srgb,var(--ok) 40%,transparent);white-space:nowrap}
.st.cx{background:var(--warn-bg);color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.type{margin-top:2px;font-size:15px}
.meta{margin-top:8px;display:flex;flex-wrap:wrap;gap:6px}
.meta span{background:var(--chip);border:1px solid var(--line);border-radius:8px;padding:2px 9px;font-size:13px;color:var(--mute)}
.price{margin-top:12px;display:flex;justify-content:space-between;align-items:flex-end;gap:8px;border-top:1px solid var(--line);padding-top:11px}
.price .l{font-size:12px;color:var(--mute)}
.price .v{font-size:17px;font-weight:600;font-family:Consolas,"SF Mono",Menlo,monospace}
.price .net{text-align:right}
.price .net .v{font-size:24px;font-weight:800;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 8px rgba(0,229,255,.35))}
.more{color:var(--mute);font-size:12px;margin-top:9px;text-align:center}
.detail{display:none;padding:0 15px 15px 18px}
.card.open .detail{display:block}
.card.open .more{display:none}
.promo{background:var(--accent-soft);border:1px solid rgba(139,92,246,.28);border-radius:12px;padding:10px 12px}
.promo h4{margin:0 0 6px;font-size:12px;color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.row{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:14px}
.row+.row{border-top:1px solid var(--line)}
.row span:first-child{color:var(--mute)}
.row b{font-weight:600;font-family:Consolas,"SF Mono",Menlo,monospace}
.row.tot{font-weight:700}
.row.tot span:first-child{color:var(--ink)}
.row.sub{background:rgba(0,229,255,.08);margin:2px -8px;padding:6px 8px;border-radius:8px;border:0}
.row.sub span:first-child{color:var(--brand)}
.row.sub b{color:var(--brand)}
.row.fin{margin:4px -8px 0;padding:8px;border-radius:8px;background:var(--grad);border:0}
.row.fin span:first-child,.row.fin b{color:#fff}
.ev{margin-top:10px;display:flex;justify-content:space-between;align-items:center;font-size:14px;background:var(--chip);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
.ev b{color:var(--brand)}
.free{margin-top:8px;font-size:13px;color:var(--mute);text-align:center}
.empty{text-align:center;color:var(--mute);padding:50px 20px}
.loadmore{display:block;margin:10px auto;border:1px solid var(--brand);background:transparent;color:var(--brand);border-radius:12px;padding:10px 22px}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.6);backdrop-filter:blur(3px);opacity:0;pointer-events:none;transition:.2s;z-index:30}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:88vh;background:#0a1220;border:1px solid var(--line);border-bottom:0;border-radius:22px 22px 0 0;z-index:40;transform:translateY(105%);transition:transform .25s;display:flex;flex-direction:column;max-width:760px;margin:0 auto;box-shadow:0 -10px 40px rgba(0,229,255,.12)}
body.fo .scrim{opacity:1;pointer-events:auto}
body.fo .sheet{transform:none}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line)}
.sh-h h2{margin:0;font-size:17px;letter-spacing:.06em}
.sh-h button{border:0;background:none;color:var(--brand);font-size:14px;padding:6px}
.sh-b{overflow:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.grp{padding:12px 0;border-bottom:1px solid var(--line)}
.grp:last-child{border:0}
.grp h3{margin:0 0 8px;font-size:14px;display:flex;justify-content:space-between}
.grp h3 small{font-weight:400;color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;padding:7px 13px;font-size:14px;cursor:pointer;user-select:none;transition:.15s}
.chip.on{background:var(--grad);color:#fff;border-color:transparent;font-weight:700;box-shadow:0 0 14px rgba(0,229,255,.35)}
.chip em{font-style:normal;opacity:.6;font-size:12px;margin-left:4px}
.range{display:flex;gap:10px;align-items:center}
.range input{flex:1;min-width:0;border:1px solid var(--line);background:var(--chip);border-radius:10px;padding:9px 10px;outline:none}
.sh-f{display:flex;gap:10px;padding:12px 16px;padding-bottom:max(12px,env(safe-area-inset-bottom));border-top:1px solid var(--line)}
.sh-f button{flex:1;border-radius:12px;padding:13px;border:1px solid var(--line);background:var(--chip);font-weight:600}
.sh-f .go{background:var(--grad);color:#fff;border-color:transparent;flex:2;box-shadow:0 0 18px rgba(139,92,246,.45)}
.updated{text-align:center;color:var(--mute);font-size:12px;padding:18px}
</style>
</head>

  const m=new Map();U.forEach(u=>{const v=u[k];if(v===''||v==null)return;m.set(v,(m.get(v)||0)+1)});

  const G=document.getElementById('groups');
  G.innerHTML=FIELDS.map(f=>`<div class="grp"><h3>${f.t}${f.def?'':''}<small>${F[f.k].size?'เลือก '+F[f.k].size:'ทั้งหมด'}</small></h3><div class="chips" data-k="${f.k}">${
    OPTS[f.k].map(([v,c])=>`<span class="chip ${F[f.k].has(v)?'on':''}" data-v="${String(v).replace(/"/g,'&quot;')}">${f.fmt?f.fmt(v):v}<em>${c}</em></span>`).join('')}</div></div>`).join('')
  +`<div class="grp"><h3>ช่วงราคาขาย <small>หน่วย: ล้านบาท</small></h3><div class="range"><input id="pmin" type="number" step="0.1" inputmode="decimal" placeholder="ต่ำสุด" value="${pMin}"><span>–</span><input id="pmax" type="number" step="0.1" inputmode="decimal" placeholder="สูงสุด" value="${pMax}"></div></div>`;
}
// events
const $=id=>document.getElementById(id);
$('list').addEventListener('click',e=>{
  if(e.target.id==='lm'){shown+=40;render();return}
  const b=e.target.closest('.card>button');if(!b)return;
  const c=b.parentElement;c.classList.toggle('open');b.setAttribute('aria-expanded',c.classList.contains('open'));
});
$('groups').addEventListener('click',e=>{
  const c=e.target.closest('.chip');if(!c)return;
  const k=c.parentElement.dataset.k,f=FIELDS.find(x=>x.k===k);
  let v=c.dataset.v;if(f.num)v=+v;
  F[k].has(v)?F[k].delete(v):F[k].add(v);
  c.classList.toggle('on');
  c.parentElement.previousElementSibling.querySelector('small').textContent=F[k].size?'เลือก '+F[k].size:'ทั้งหมด';
});
const openS=()=>{renderSheet();document.body.classList.add('fo')};
const closeS=()=>{pMin=$('pmin').value;pMax=$('pmax').value;document.body.classList.remove('fo');shown=40;render();scrollTo(0,0)};
$('open').onclick=openS;$('scrim').onclick=closeS;$('apply').onclick=closeS;
$('reset').onclick=()=>{resetDefaults();renderSheet()};
$('clear').onclick=()=>{FIELDS.forEach(f=>F[f.k]=new Set());pMin=pMax='';renderSheet()};
$('q').addEventListener('input',e=>{q=e.target.value.trim().toLowerCase();shown=40;render()});
$('sort').onchange=()=>{shown=40;render()};
$('upd').textContent='ราคา '+META.priceDate;
$('foot').textContent='ข้อมูลล่าสุด: '+META.file+' · ราคาอาจเปลี่ยนแปลง กรุณาตรวจสอบกับ Sales Admin ก่อนเสนอลูกค้า';
render();
</script>
</body>
</html>
